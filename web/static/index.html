<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FaxApp</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --bg:#fbfcfd;--surface:#ffffff;--surface-2:#f6f8fa;--border:#e8ecf1;--border-strong:#d8dee6;
  --text:#111826;--text-2:#5b6675;--text-3:#98a2b3;
  --accent:#4f46e5;--accent-weak:#eef0fe;--accent-hover:#4338ca;
  --ok:#12805c;--ok-weak:#e7f4ef;--err:#c0362c;--err-weak:#fbecea;--wait:#b26b00;--wait-weak:#fbf1e0;
  --mono:'SF Mono','JetBrains Mono','Roboto Mono',ui-monospace,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  --r:10px;--r-sm:7px;--r-lg:14px;
  --sh-sm:0 1px 2px rgba(17,24,38,.05);--sh:0 1px 3px rgba(17,24,38,.08),0 1px 2px rgba(17,24,38,.04);--sh-lg:0 8px 28px rgba(17,24,38,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--text)}
svg{display:block}
::selection{background:var(--accent-weak)}
.ic{width:18px;height:18px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic-sm{width:15px;height:15px}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 30% 20%,#f0f3f8,#fbfcfd)}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:40px 38px;width:100%;max-width:380px;box-shadow:var(--sh-lg)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.auth-logo .mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.auth-logo .mark svg{width:20px;height:20px;stroke:#fff;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.auth h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.auth .sub{color:var(--text-3);font-size:13px;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.inp{width:100%;padding:11px 13px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.btn-primary{width:100%;padding:12px;background:var(--accent);color:#fff;border-radius:var(--r-sm);font-size:14px;font-weight:600;transition:background .15s}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{opacity:.6;cursor:default}
.auth-err{background:var(--err-weak);color:var(--err);padding:11px 13px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;margin-bottom:16px}
.shell{display:flex;min-height:100vh}
.side{width:224px;background:var(--surface);border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-top{padding:20px 20px 16px;display:flex;align-items:center;gap:11px}
.side-top .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.side-top .mark svg{width:17px;height:17px;stroke:#fff;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.side-top .nm{font-size:15.5px;font-weight:700;letter-spacing:-.3px}
.nav{padding:8px 12px;flex:1;overflow-y:auto}
.nav-sec{font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.4px;padding:14px 10px 6px;text-transform:uppercase}
.nav-sec:first-child{padding-top:4px}
.nav-a{display:flex;align-items:center;gap:11px;padding:8.5px 10px;border-radius:var(--r-sm);color:var(--text-2);font-weight:500;font-size:13.5px;cursor:pointer;transition:background .12s,color .12s}
.nav-a:hover{background:var(--surface-2);color:var(--text)}
.nav-a.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav-a .lbl{flex:1}
.nav-a .cnt{font-size:11.5px;font-weight:600;color:var(--text-3);font-family:var(--mono)}
.nav-a.on .cnt{color:var(--accent)}
.side-user{padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:8px;background:var(--accent-weak);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.side-user .who{flex:1;min-width:0}
.side-user .who .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .who .r{font-size:11.5px;color:var(--text-3)}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);color:var(--text-3);display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.head{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--surface)}
.head h2{font-size:17px;font-weight:700;letter-spacing:-.3px}
.head .head-sub{font-size:12.5px;color:var(--text-3);margin-top:1px}
.content{padding:28px;flex:1;overflow-y:auto;max-width:1180px;width:100%}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-sm);margin-bottom:20px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.card-t{font-size:14px;font-weight:650;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.card-t .muted{color:var(--text-3);font-weight:500}
.card-b{padding:18px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:17px 18px;box-shadow:var(--sh-sm)}
.stat .lbl{font-size:12px;color:var(--text-2);font-weight:550;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.stat .lbl .dot{width:7px;height:7px;border-radius:2px;background:var(--accent)}
.stat .lbl .dot.ok{background:var(--ok)}.stat .lbl .dot.err{background:var(--err)}.stat .lbl .dot.wait{background:var(--wait)}
.stat .num{font-size:29px;font-weight:700;letter-spacing:-1.2px;line-height:1}
.stat .meta{font-size:12px;color:var(--text-3);margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{text-align:left;padding:10px 16px;font-size:11.5px;color:var(--text-3);font-weight:600;letter-spacing:.2px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl tbody td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-weak);color:var(--ok)}
.b-err{background:var(--err-weak);color:var(--err)}
.b-wait{background:var(--wait-weak);color:var(--wait)}
.b-dim{background:var(--surface-2);color:var(--text-3)}
.b-send{background:var(--accent-weak);color:var(--accent)}
.role{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600}
.role-admin{background:var(--err-weak);color:var(--err)}
.role-manager{background:var(--wait-weak);color:var(--wait)}
.role-user{background:var(--accent-weak);color:var(--accent)}
.dim{color:var(--text-3)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);border-radius:var(--r-sm);font-size:13px;font-weight:550;transition:all .13s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.btn:disabled{opacity:.5;cursor:default}
.btn:disabled:hover{border-color:var(--border-strong);color:var(--text-2);background:var(--surface)}
.btn-a{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-a:hover{background:var(--accent-hover);color:#fff;border-color:var(--accent-hover)}
.btn-s{padding:6px 11px;font-size:12.5px}
.btn-x{padding:5px 10px;font-size:12px}
.btn-err:hover{border-color:var(--err);color:var(--err);background:var(--err-weak)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-row{display:flex;gap:7px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{padding:5px 12px;font-size:12.5px;font-weight:550;color:var(--text-2);border-radius:5px;transition:all .12s}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--sh-sm);font-weight:600}
.frm{margin-bottom:15px}
.frm label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.frm .inp,.frm select,.frm textarea{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.frm .inp:focus,.frm select:focus,.frm textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.frm textarea{resize:vertical;min-height:60px}
.drop{border:1.5px dashed var(--border-strong);border-radius:var(--r);padding:26px;text-align:center;color:var(--text-3);background:var(--surface-2);cursor:pointer;transition:all .15s;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.drop.has{border-color:var(--ok);color:var(--ok);border-style:solid;background:var(--ok-weak)}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:550;cursor:pointer;color:var(--text-2)}
.check input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.empty{padding:56px 20px;text-align:center;color:var(--text-3)}
.empty svg{width:34px;height:34px;stroke:var(--text-3);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;margin:0 auto 14px;opacity:.6}
.empty .t{font-size:14px;font-weight:600;color:var(--text-2)}
.empty .d{font-size:13px;margin-top:5px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 20px;border-radius:var(--r-sm);font-size:13.5px;font-weight:550;box-shadow:var(--sh-lg);z-index:300;display:flex;align-items:center;gap:9px;animation:toast .25s cubic-bezier(.16,1,.3,1)}
.toast svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}
@keyframes toast{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding:16px 4px 0}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart-bars{width:100%;display:flex;gap:3px;align-items:flex-end;height:100%;justify-content:center}
.chart-bar{width:44%;border-radius:3px 3px 0 0;min-height:2px;transition:height .4s cubic-bezier(.16,1,.3,1)}
.chart-bar.s{background:var(--accent)}
.chart-bar.r{background:#a5b4fc}
.chart-x{font-size:11px;color:var(--text-3);font-family:var(--mono);white-space:nowrap}
.chart-legend{display:flex;gap:16px;font-size:12px;color:var(--text-2)}
.chart-legend span{display:flex;align-items:center;gap:6px}
.chart-legend i{width:10px;height:10px;border-radius:3px}
.scrim{position:fixed;inset:0;background:rgba(17,24,38,.45);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border)}
.modal-h .t{font-size:14.5px;font-weight:650}
.modal-b{padding:20px;overflow-y:auto;background:var(--surface-2)}
.pv-img{max-width:100%;display:block;margin:0 auto;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;box-shadow:var(--sh)}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.center-load{display:flex;justify-content:center;padding:60px}
.grid-2{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.grid-side{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.grid-2,.grid-side{grid-template-columns:1fr}.side{width:64px}.side-top .nm,.nav-sec,.nav-a .lbl,.nav-a .cnt,.side-user .who,.side-user .icon-btn{display:none}}
.inline-edit{display:flex;gap:5px;align-items:center}
.inline-edit input{padding:4px 8px;border:1px solid var(--border-strong);border-radius:5px;font-size:12.5px;width:130px}
.link{color:var(--accent);cursor:pointer;font-weight:550}
.link:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback}=React;
const I={
  bell:<svg viewBox="0 0 24 24" className="ic"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
  clock:<svg viewBox="0 0 24 24" className="ic"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>,
  fax:<svg viewBox="0 0 24 24" className="ic"><path d="M6 9V3h12v6M6 18h12v3H6zM4 9h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2z"/><path d="M8 13h.01M12 13h.01"/></svg>,
  grid:<svg viewBox="0 0 24 24" className="ic"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>,
  send:<svg viewBox="0 0 24 24" className="ic"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>,
  list:<svg viewBox="0 0 24 24" className="ic"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>,
  inbox:<svg viewBox="0 0 24 24" className="ic"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>,
  book:<svg viewBox="0 0 24 24" className="ic"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,
  chart:<svg viewBox="0 0 24 24" className="ic"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>,
  users:<svg viewBox="0 0 24 24" className="ic"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
  building:<svg viewBox="0 0 24 24" className="ic"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></svg>,
  power:<svg viewBox="0 0 24 24" className="ic"><path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"/></svg>,
  refresh:<svg viewBox="0 0 24 24" className="ic ic-sm"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M3 21v-5h5"/></svg>,
  eye:<svg viewBox="0 0 24 24" className="ic ic-sm"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>,
  x:<svg viewBox="0 0 24 24" className="ic ic-sm"><path d="M18 6 6 18M6 6l12 12"/></svg>,
  trash:<svg viewBox="0 0 24 24" className="ic ic-sm"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
  check:<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>,

  file:<svg viewBox="0 0 24 24" className="ic ic-sm"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>,
  chevL:<svg viewBox="0 0 24 24" className="ic ic-sm"><path d="M15 18l-6-6 6-6"/></svg>,
  chevR:<svg viewBox="0 0 24 24" className="ic ic-sm"><path d="M9 18l6-6-6-6"/></svg>,
  alert:<svg viewBox="0 0 24 24" className="ic"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>,
  upload:<svg viewBox="0 0 24 24" className="ic ic-sm"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>,
  download:<svg viewBox="0 0 24 24" className="ic ic-sm"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>,
  clip:<svg viewBox="0 0 24 24" style={{width:20,height:20,stroke:'currentColor',strokeWidth:1.75,fill:'none',strokeLinecap:'round',strokeLinejoin:'round'}}><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>,
};
const API='';
async function api(path,opts={}){
  const r=await fetch(API+path,{credentials:'include',headers:opts.body&&!(opts.body instanceof FormData)?{'Content-Type':'application/json'}:{},...opts});
  if(!r.ok){const e=await r.json().catch(()=>({detail:r.statusText}));throw new Error(e.detail||'요청을 처리하지 못했습니다');}
  return r.status===204?null:r.json();
}
const J=o=>JSON.stringify(o);
const fmt=ts=>{if(!ts)return'-';const s=String(ts);return s.slice(5,16).replace('T',' ');};
function Loading(){return <div className="center-load"><span className="spinner"/></div>;}
function Empty({icon,t,d}){return <div className="empty">{icon}<div className="t">{t}</div>{d&&<div className="d">{d}</div>}</div>;}
function Login({onLogin}){
  const [u,setU]=useState(''),[p,setP]=useState(''),[err,setErr]=useState(''),[busy,setBusy]=useState(false);
  const submit=async()=>{setErr('');setBusy(true);try{const r=await api('/api/auth/login',{method:'POST',body:J({username:u,password:p})});onLogin(r.user);}catch(e){setErr(e.message);}finally{setBusy(false);}};

function ImportModal({toast,onClose,onDone}){

      </div>}

function MailMerge({toast}){
  const [csvText,setCsvText]=useState(''),[file,setFile]=useState(null),[coverTpl,setCoverTpl]=useState('standard');
  const [tpls,setTpls]=useState([]),[busy,setBusy]=useState(false),[result,setResult]=useState(null);
  useEffect(()=>{api('/api/fax/cover-templates').then(setTpls).catch(()=>{});},[]);
  const parsed=(()=>{try{const lines=csvText.trim().split('\n').filter(l=>l.trim());if(lines.length<2)return[];const h=lines[0].toLowerCase();const hasNum=h.includes('number')||h.includes('번호');return hasNum?lines.slice(1):[];}catch{return[];}})();
  const send=async()=>{
    if(!file)return toast('공통 본문 문서를 선택하세요','err');
    if(parsed.length===0)return toast('CSV에 수신자를 입력하세요 (헤더+최소 1행)','err');
    setBusy(true);setResult(null);
    try{const fd=new FormData();fd.append('file',file);fd.append('csv_data',csvText);fd.append('cover_template',coverTpl);
      const r=await api('/api/fax/mailmerge',{method:'POST',body:fd});
      setResult(r);toast('대량 발송 요청 완료 · '+r.queued+'/'+r.total+'건','ok');
    }catch(e){toast(e.message,'err');}finally{setBusy(false);}
  };
  return <div className="card" style={{maxWidth:680}}>
    <div className="card-h"><div className="card-t">대량 맞춤 발송 <span className="dim" style={{fontWeight:400,fontSize:12}}>· 수신자별 개별 표지</span></div></div>
    <div className="card-b">
      <div className="dim" style={{fontSize:13,marginBottom:16}}>공통 본문 하나에, 수신자별로 다른 표지(이름·제목·메모)를 붙여 한 번에 보냅니다. CSV로 수신자 목록을 입력하세요.</div>
      <div className="frm"><label>수신자 목록 (CSV)</label>
        <textarea value={csvText} onChange={e=>setCsvText(e.target.value)} rows={7} style={{fontFamily:'monospace',fontSize:13}}
          placeholder={'number,name,title,memo\n02-1234-5678,대성물산 김부장,계약서 송부,검토 부탁드립니다\n031-777-8888,한빛기업,견적 안내,'}/>
        <div className="dim" style={{fontSize:12,marginTop:6}}>첫 줄은 헤더: number(필수),name,title,memo · 한글 헤더(번호,이름,제목,메모)도 가능
          {parsed.length>0&&<span style={{color:'var(--accent,#2563eb)',fontWeight:600}}> · 수신자 {parsed.length}명 인식됨</span>}</div></div>
      <div className="frm"><label>공통 본문 문서</label>
        <label className={'drop'+(file?' has':'')}>{file?I.file:I.clip}<span>{file?file.name:'모든 수신자에게 공통으로 나갈 문서'}</span>
          <input type="file" style={{display:'none'}} onChange={e=>setFile(e.target.files[0])}/></label></div>
      {tpls.length>0&&<div className="frm"><label>표지 스타일</label>
        <div className="seg" style={{width:'100%'}}>{tpls.map(t=><button key={t.id} type="button" className={coverTpl===t.id?'on':''} onClick={()=>setCoverTpl(t.id)} style={{flex:1}}>{t.name}</button>)}</div></div>}
      <button className="btn btn-a" onClick={send} disabled={busy} style={{width:'100%',justifyContent:'center',padding:12}}>{busy?'발송 중…':(parsed.length>0?parsed.length+'명에게 발송':'대량 발송')}</button>
      {result&&<div style={{marginTop:16,padding:'12px 15px',borderRadius:'var(--r-sm)',background:'var(--surface-2)'}}>
        <div style={{fontWeight:600,marginBottom:8}}>발송 결과 · {result.queued}/{result.total}건 요청됨</div>
        {result.results&&result.results.filter(r=>!r.ok).length>0&&<div style={{fontSize:13,color:'var(--danger,#e0483d)'}}>실패: {result.results.filter(r=>!r.ok).map(r=>r.number).join(', ')}</div>}
      </div>}
    </div></div>;
}

           <td className="mono">{k.call_count}</td>
           <td className="dim">{fmt(k.last_used_at)}</td>
           <td>{k.is_active?<span style={{color:'var(--ok,#0f9d58)',fontWeight:600,fontSize:12}}>활성</span>:<span className="dim" style={{fontSize:12}}>폐기됨</span>}</td>
           <td>{k.is_active&&<button className="btn btn-x" onClick={()=>revoke(k.id)}>폐기</button>}</td>
         </tr>)}</tbody></table>}
      </div></div>
  </div>;
}

function NotifyConfig({toast}){
  const [cfg,setCfg]=useState(null),[busy,setBusy]=useState(false),[err,setErr]=useState(null);
  useEffect(()=>{api('/api/notify/config').then(c=>{setCfg(c);setErr(null);}).catch(e=>{setErr(e.message);setCfg({webhook_url:'',notify_on_fail:true,notify_on_recv:false});});},[]);
  const save=async()=>{setBusy(true);try{await api('/api/notify/config',{method:'POST',body:J(cfg)});toast('알림 설정 저장됨','ok');setErr(null);}catch(e){toast(e.message,'err');setErr(e.message);}finally{setBusy(false);}};
  const test=async()=>{try{const r=await api('/api/notify/test',{method:'POST'});toast(r.message||'테스트 알림 발송','ok');}catch(e){toast(e.message,'err');}};
  if(!cfg)return <Loading/>;
  return <div className="card" style={{maxWidth:640}}>
    <div className="card-h"><div className="card-t">알림 설정</div></div>
    <div className="card-b">
      {err&&<div style={{marginBottom:14,padding:'11px 15px',borderRadius:'var(--r-sm)',background:'#fdecea',color:'#a3271f',fontSize:13,lineHeight:1.6}}>
        <b>알림 기능이 아직 설정되지 않았습니다.</b><br/>데이터베이스 준비가 필요합니다. 서버에서 다음을 실행하세요:<br/>
        <code style={{display:'block',marginTop:6,padding:'6px 10px',background:'#fff',borderRadius:5,fontSize:12}}>sudo -u postgres psql -d faxapp -f sql/migration_notify.sql</code></div>}
      <div className="dim" style={{fontSize:13,marginBottom:16}}>발송 실패나 수신 시 알림을 받습니다. 웹훅을 설정하면 Slack 등 외부로도 전송됩니다.</div>
      <div className="frm"><label>웹훅 URL <span className="dim">(선택 · Slack Incoming Webhook 등)</span></label>
        <input className="inp" value={cfg.webhook_url||''} onChange={e=>setCfg({...cfg,webhook_url:e.target.value})} placeholder="https://hooks.slack.com/services/..."/></div>
      <label className="check" style={{marginBottom:12}}><input type="checkbox" checked={cfg.notify_on_fail} onChange={e=>setCfg({...cfg,notify_on_fail:e.target.checked})}/>발송 실패 시 알림</label>
      <label className="check" style={{marginBottom:18}}><input type="checkbox" checked={cfg.notify_on_recv} onChange={e=>setCfg({...cfg,notify_on_recv:e.target.checked})}/>팩스 수신 시 알림</label>
      <div className="btn-row">
        <button className="btn btn-a" onClick={save} disabled={busy}>{busy?'저장 중…':'저장'}</button>
        <button className="btn btn-s" onClick={test}>테스트 알림 보내기</button></div>
    </div></div>;
}

function ErrorLog({toast}){
  const [sum,setSum]=useState(null),[list,setList]=useState(null),[cat,setCat]=useState('');
  const load=()=>{api('/api/errors/summary?days=7').then(setSum).catch(()=>setSum({total:0,unresolved:0,by_category:[],by_code:[]}));
    api('/api/errors'+(cat?'?category='+cat:'')).then(setList).catch(()=>setList([]));};
  useEffect(()=>{load();},[cat]);
  const resolve=async id=>{try{await api('/api/errors/'+id+'/resolve',{method:'POST'});load();}catch(e){toast(e.message,'err');}};
  const resolveAll=async()=>{if(!confirm('모든 오류를 처리됨으로 표시할까요?'))return;try{await api('/api/errors/resolve-all',{method:'POST'});toast('처리 완료','ok');load();}catch(e){toast(e.message,'err');}};
  const clearAll=async()=>{if(!confirm('오류/알람 로그를 전체 삭제할까요? (되돌릴 수 없습니다)'))return;try{const r=await api('/api/errors/clear-all?confirm=true',{method:'DELETE'});toast(r.message||'전체 삭제됨','ok');load();}catch(e){toast(e.message,'err');}};
  if(!sum||!list)return <Loading/>;
  const CATS=[['','전체'],['user','사용자'],['retryable','일시적'],['permanent','영구'],['system','시스템']];
  return <div>
    <div className="stats-grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))'}}>
      <div className="stat"><div className="lbl"><span className="dot err"/>최근 7일 오류</div><div className="num">{sum.total}</div></div>
      <div className="stat"><div className="lbl"><span className="dot wait"/>미처리</div><div className="num">{sum.unresolved}</div></div>
      {sum.by_category.slice(0,2).map(c=><div className="stat" key={c.category}><div className="lbl"><span className="dot"/>{(ECAT[c.category]||['','?'])[1]}</div><div className="num">{c.cnt}</div></div>)}
    </div>
    {sum.by_code.length>0&&<div className="card"><div className="card-h"><div className="card-t">자주 발생한 오류</div></div>
      <div className="card-b"><div className="mbars">{sum.by_code.slice(0,8).map(c=>{const mx=sum.by_code[0].cnt||1;const[cc]=ECAT[c.category]||['b-dim'];return <div className="mbar" key={c.code}>
        <div className="l"><span className={'badge '+cc} style={{fontSize:10.5}}>{c.code}</span></div>
        <div className="track"><div className="fill" style={{width:(c.cnt/mx*100)+'%',background:c.category==='permanent'||c.category==='system'?'var(--err)':'var(--wait)'}}/></div>
        <div className="v">{c.cnt}</div></div>;})}</div></div></div>}
    <div className="card">
      <div className="card-h"><div className="seg">{CATS.map(([v,l])=><button key={v} className={cat===v?'on':''} onClick={()=>setCat(v)}>{l}</button>)}</div>
        {sum.unresolved>0&&<button className="btn btn-s" onClick={resolveAll}>{I.check}전체 처리</button>}
        {sum.total>0&&<button className="btn btn-s" onClick={clearAll} style={{color:'#e0483d'}}>전체 삭제</button>}</div>
      {list.length?<table className="tbl"><thead><tr><th>시각</th><th>코드</th><th>성격</th><th>내용</th><th>사용자</th><th></th></tr></thead>
      <tbody>{list.map(e=>{const[cc,cl]=ECAT[e.category]||['b-dim',e.category];return <tr key={e.id} style={{opacity:e.resolved?.5:1}}>
        <td className="mono dim">{fmt(e.created_at)}</td><td className="mono" style={{fontWeight:600}}>{e.code}</td>
        <td><span className={'badge '+cc}>{cl}</span></td><td className="dim" style={{maxWidth:320,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={e.detail}>{e.detail}</td>
        <td className="dim">{e.username||'-'}</td>
        <td>{!e.resolved&&<button className="btn btn-x" onClick={()=>resolve(e.id)}>처리</button>}</td>
      </tr>;})}</tbody></table>:<Empty icon={I.check} t="오류 없음" d="최근 기록된 오류가 없습니다"/>}
    </div>
  </div>;
}

const NAV=[
  {id:'dashboard',ic:'grid',label:'대시보드',sec:'현황'},
  {id:'diag',ic:'alert',label:'시스템 진단',sec:'현황'},
  {id:'send',ic:'send',label:'팩스 보내기',sec:'발송'},
  {id:'history',ic:'list',label:'발송 이력',sec:'발송'},
  {id:'mailmerge',ic:'users',label:'대량 발송',sec:'발송'},
  {id:'scheduled',ic:'clock',label:'예약 발송',sec:'발송'},
  {id:'inbox',ic:'inbox',label:'받은 팩스',sec:'수신'},
  {id:'contacts',ic:'book',label:'주소록',sec:'관리'},
  {id:'stats',ic:'chart',label:'통계',sec:'관리',roles:['admin','manager']},
  {id:'users',ic:'users',label:'사용자',sec:'설정',roles:['admin']},
  {id:'depts',ic:'building',label:'부서',sec:'설정',roles:['admin']},
  {id:'errlog',ic:'alert',label:'오류 로그',sec:'설정',roles:['admin']},
  {id:'notifycfg',ic:'bell',label:'알림 설정',sec:'설정',roles:['admin']},
  {id:'apikeys',ic:'users',label:'API 연동',sec:'설정',roles:['admin']},
];
const TITLES={dashboard:['대시보드','오늘의 팩스 현황'],diag:['시스템 진단','문제 위치 실시간 확인'],send:['팩스 보내기',''],history:['발송 이력','보낸 팩스 관리'],mailmerge:['대량 발송','수신자별 맞춤 발송'],scheduled:['예약 발송','예약된 팩스 관리'],inbox:['받은 팩스',''],contacts:['주소록',''],stats:['통계','부서·사용자별 집계'],users:['사용자 관리',''],depts:['부서 관리',''],errlog:['오류 로그','시스템 예외 추적'],notifycfg:['알림 설정','실패·수신 통보 설정'],apikeys:['API 연동','외부 시스템 팩스 발송 키']};
function App(){
  const [user,setUser]=useState(undefined),[page,setPage]=useState('dashboard'),[toastMsg,setToast]=useState(null),[unread,setUnread]=useState(0);
  const [notifs,setNotifs]=useState([]),[notifOpen,setNotifOpen]=useState(false),[notifUnread,setNotifUnread]=useState(0);
  const loadNotifs=()=>{if(!user)return;api('/api/notify/list?limit=30').then(setNotifs).catch(()=>{});api('/api/notify/unread-count').then(d=>setNotifUnread(d.unread)).catch(()=>{});};
  useEffect(()=>{if(user){loadNotifs();const t=setInterval(loadNotifs,30000);return()=>clearInterval(t);}},[user,page]);
  const readAllNotif=async()=>{await api('/api/notify/read-all',{method:'POST'}).catch(()=>{});loadNotifs();};
  const readNotif=async(id)=>{await api('/api/notify/'+id+'/read',{method:'POST'}).catch(()=>{});loadNotifs();};
  const toast=useCallback((m,type)=>{setToast({m,type});setTimeout(()=>setToast(null),2600);},[]);
  useEffect(()=>{api('/api/auth/me').then(setUser).catch(()=>setUser(null));},[]);
  useEffect(()=>{if(user)api('/api/receive/unread/count').then(d=>setUnread(d.unread)).catch(()=>{});},[user,page]);
  if(user===undefined)return <div className="auth"><span className="spinner"/></div>;
  if(user===null)return <Login onLogin={setUser}/>;
  const logout=async()=>{await api('/api/auth/logout',{method:'POST'}).catch(()=>{});setUser(null);};
  const nav=NAV.filter(n=>!n.roles||n.roles.includes(user.role));
  const secs=[...new Set(nav.map(n=>n.sec))];
  const ti=TITLES[page]||['',''];
  const PAGES={dashboard:<Dashboard/>,diag:<Diagnostics toast={toast}/>,send:<Send toast={toast}/>,history:<SendHistory toast={toast}/>,mailmerge:<MailMerge toast={toast}/>,scheduled:<Scheduled toast={toast}/>,inbox:<Inbox toast={toast} user={user}/>,contacts:<Contacts toast={toast}/>,stats:<Stats/>,users:<UserAdmin toast={toast}/>,depts:<DeptAdmin toast={toast}/>,errlog:<ErrorLog toast={toast}/>,notifycfg:<NotifyConfig toast={toast}/>,apikeys:<ApiKeys toast={toast}/>};
  return <div className="shell">
    <aside className="side">
      <div className="side-top"><div className="mark">{I.fax}</div><div className="nm">FaxApp</div></div>
      <nav className="nav">{secs.map(s=><div key={s}>
        <div className="nav-sec">{s}</div>
        {nav.filter(n=>n.sec===s).map(n=><div key={n.id} className={'nav-a'+(page===n.id?' on':'')} onClick={()=>setPage(n.id)}>
          {I[n.ic]}<span className="lbl">{n.label}</span>{n.id==='inbox'&&unread>0&&<span className="cnt">{unread}</span>}</div>)}
      </div>)}</nav>
      <div className="side-user"><div className="avatar">{(user.display_name||user.username||'U')[0]}</div>
        <div className="who"><div className="n">{user.display_name||user.username}</div><div className="r">{({admin:'관리자',manager:'매니저',user:'사용자'})[user.role]||user.role}</div></div>
        <button className="icon-btn" onClick={logout} title="로그아웃">{I.power}</button></div>
    </aside>
    <main className="main">
      <header className="head"><div><h2>{ti[0]}</h2>{ti[1]&&<div className="head-sub">{ti[1]}</div>}</div>
        <div style={{position:'relative'}}>
          <button className="icon-btn" onClick={()=>{setNotifOpen(o=>!o);if(!notifOpen)loadNotifs();}} title="알림" style={{position:'relative'}}>
            {I.bell}{notifUnread>0&&<span style={{position:'absolute',top:-2,right:-2,background:'var(--danger,#e0483d)',color:'#fff',fontSize:10,fontWeight:600,minWidth:16,height:16,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 4px'}}>{notifUnread}</span>}
          </button>
          {notifOpen&&<div style={{position:'absolute',right:0,top:42,width:360,maxHeight:440,overflowY:'auto',background:'var(--surface-2,#fff)',border:'1px solid var(--line,#e3e8ef)',borderRadius:12,boxShadow:'0 8px 28px rgba(0,0,0,.14)',zIndex:100}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 16px',borderBottom:'1px solid var(--line,#e3e8ef)'}}>
              <span style={{fontWeight:600}}>알림</span>
              {notifUnread>0&&<span className="link" style={{fontSize:12,cursor:'pointer'}} onClick={readAllNotif}>모두 읽음</span>}</div>
            {notifs.length===0?<div className="dim" style={{padding:'28px 16px',textAlign:'center',fontSize:13}}>알림이 없습니다</div>:
             notifs.map(n=><div key={n.id} onClick={()=>readNotif(n.id)} style={{padding:'11px 16px',borderBottom:'1px solid var(--line,#f0f0f0)',cursor:'pointer',background:n.is_read?'transparent':'var(--accent-soft,#eef4ff)'}}>
               <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:3}}>
                 <span style={{width:7,height:7,borderRadius:'50%',flexShrink:0,background:n.level==='error'?'#e0483d':n.level==='warn'?'#e08c1a':'#2563eb'}}></span>
                 <span style={{fontWeight:600,fontSize:13}}>{n.title}</span></div>
               {n.body&&<div className="dim" style={{fontSize:12,whiteSpace:'pre-wrap',marginLeft:14,lineHeight:1.5}}>{n.body}</div>}
               <div className="dim" style={{fontSize:11,marginLeft:14,marginTop:4}}>{fmt(n.created_at)}</div>
             </div>)}
          </div>}
        </div>
      </header>
      <div className="content">{PAGES[page]}</div>
    </main>
    {toastMsg&&<div className={'toast '+(toastMsg.type||'')}>{toastMsg.type==='ok'?I.check:toastMsg.type==='err'?I.x:null}{toastMsg.m}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
